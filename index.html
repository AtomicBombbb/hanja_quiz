<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 박사 孫愈宙</title>
<style>
:root{--bg:#faf8f4;--fg:#1d1b18;--card:#fff;--line:#ddd6ca;--acc:#8a2b22;--ok:#1f7a45;--no:#b3261e;--mut:#6d665b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--fg:#efe9dd;--card:#221f19;--line:#3a352b;--acc:#e0877d;--ok:#5fcf8f;--no:#ff8a80;--mut:#a79f90;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16140f;--fg:#efe9dd;--card:#221f19;--line:#3a352b;--acc:#e0877d;--ok:#5fcf8f;--no:#ff8a80;--mut:#a79f90;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
main{width:100%;max-width:920px;margin:0 auto;padding:16px}
@supports (padding: max(0px)) { main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))} }
.home-layout{display:grid;grid-template-columns:1fr;gap:12px}
.home-layout .home-section{margin:0;min-width:0}
.section-settings{grid-column:1/-1}
.section-extra{grid-column:1/-1}
.settings-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.settings-field{display:flex;align-items:center;gap:8px;min-width:0}
.settings-field label{white-space:nowrap}
.settings-field select{width:100%;min-width:0}
.settings-check{display:block;margin-top:12px}
.home-section button.m{width:100%;text-align:center}
.section-study,.section-radical{display:flex;flex-direction:column;align-items:stretch}
@media(min-width:640px){
  .home-layout{grid-template-columns:1fr 1fr;gap:16px}
  .section-settings,.section-extra{grid-column:1/-1}
  .home-section{padding:20px}
  .section-study,.section-radical{align-self:stretch}
}
@media(max-width:380px){
  main{padding:10px}
  .home-section{padding:13px}
  .settings-row{gap:8px}
  .settings-field{display:block}
  .settings-field label{display:block;margin-bottom:4px}
  .settings-field select{width:100%}
}
h1{font-size:1.25rem;margin:8px 0 4px}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.home-section{border-radius:14px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.home-section h2{font-size:1rem;margin:0 0 12px;font-weight:800}
.home-section .sp{height:7px}
.section-settings{background:#f1f5f9;border-color:#d5dee8}
.section-study{background:#fff7ed;border-color:#fed7aa}
.section-radical{background:#f0fdf4;border-color:#bbf7d0}
.section-extra{background:#f5f3ff;border-color:#ddd6fe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .section-settings{background:#202a35;border-color:#39495a}:root:not([data-theme="light"]) .section-study{background:#33271c;border-color:#60452b}:root:not([data-theme="light"]) .section-radical{background:#1d3026;border-color:#345640}:root:not([data-theme="light"]) .section-extra{background:#2b2539;border-color:#4b3d65}}
:root[data-theme="dark"] .section-settings{background:#202a35;border-color:#39495a}
:root[data-theme="dark"] .section-study{background:#33271c;border-color:#60452b}
:root[data-theme="dark"] .section-radical{background:#1d3026;border-color:#345640}
:root[data-theme="dark"] .section-extra{background:#2b2539;border-color:#4b3d65}
.type{font-size:1.5rem;color:var(--acc);font-weight:700;min-height:44px;display:flex;align-items:center}
.q{font-size:3.6rem;line-height:1.2;margin:8px 0 14px;text-align:center;font-family:'Noto Serif KR','Batang','Songti SC',serif;word-break:keep-all;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:clamp(16px,3vw,24px)}
.opts button{min-width:0;min-height:72px;border:2px solid var(--mut);text-align:center;font-size:2rem;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.opts.g button{font-size:2.5rem;font-family:'Noto Serif KR','Batang','Songti SC',serif}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;min-height:48px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center;font-weight:700}
#e #next{display:block;width:max-content;max-width:100%;margin-left:auto;margin-right:0}
button.mix{background:#d32f2f;color:#fff;border-color:#d32f2f;text-align:center;font-weight:800}
button.ok,
button.ok:disabled {
    border-color:var(--ok);
    background:#e6f3eb !important;
    color:#14532d !important;
    opacity:1 !important;
}

:root[data-theme="dark"] button.ok,
:root[data-theme="dark"] button.ok:disabled {
    background:#263b30 !important;
    color:#bbf7d0 !important;
}

button.no,
button.no:disabled {
    border-color:var(--no);
    background:#fbe9e7 !important;
    color:#991b1b !important;
    opacity:1 !important;
}

:root[data-theme="dark"] button.no,
:root[data-theme="dark"] button.no:disabled {
    background:#482a28 !important;
    color:#fecaca !important;
}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.exp{margin-top:14px;font-size:1.4rem;line-height:1.6}
.answer-explanation{margin-top:8px}
.big{font-size:2.2rem;font-weight:800;color:var(--acc)}
.sp{height:8px}
ul{padding-left:18px}

/* 100점 보상 카드 */
.reward-intro{text-align:center;margin:18px 0 16px}
.reward-intro .crown{font-size:2rem}
.reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.reward-card{display:block;width:100%;position:relative;min-width:0;perspective:1000px;height:220px;border:0;padding:0;background:transparent;overflow:visible}
.reward-card:disabled{opacity:1;cursor:default}
.reward-inner{display:block;position:relative;width:100%;height:100%}
.reward-card.flipped .reward-front{transform:rotateY(-180deg);visibility:hidden}
.reward-card.flipped .reward-back{transform:rotateY(0);visibility:visible}
.reward-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;transition:transform .85s cubic-bezier(.2,.75,.25,1)}
.reward-front{color:#ffe8a3;background:radial-gradient(circle at 50% 15%,#65458b 0,#35234f 48%,#211631 100%);border:3px solid #e7bd62;box-shadow:0 7px 0 #9b7135,0 12px 22px #0003}
.reward-front:before,.reward-front:after{content:"✦";position:absolute;color:#f8d77b;opacity:.75;font-size:20px}
.reward-front:before{top:12px;left:14px}.reward-front:after{right:14px;bottom:12px}
.reward-question{font-family:Georgia,serif;font-size:3.3rem;line-height:1;color:#fff1bd;text-shadow:0 3px 0 #a46d24,0 0 18px #ffe59a}
.reward-heart{font-size:1.8rem;color:#ff91b4;text-shadow:0 0 12px #ff6b9a}
.reward-word{font-family:'Noto Serif KR','Batang',serif;font-size:2.1rem;font-weight:900;letter-spacing:.12em;color:#ffe4a0;text-shadow:0 2px 8px #f4c76b88}
.reward-tease{font-size:.83rem;font-weight:800;text-align:center;padding:0 8px;color:#fff1c9}
.reward-back{transform:rotateY(180deg);visibility:hidden;padding:15px;color:#fff;background:linear-gradient(145deg,#9b4b2e,#d18b42 48%,#7841a0);border:3px solid #ffe39a;box-shadow:0 7px 0 #80502e,0 12px 22px #0003}
.reward-back .gift{font-size:2rem}
.reward-back .reward-label{font-size:.78rem;opacity:.9}
.reward-back .reward-value{font-size:1.05rem;font-weight:900;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;max-width:100%;text-align:center}
.reward-result{text-align:center;font-weight:800;color:var(--acc);overflow-wrap:anywhere}
.reward-card.chosen{z-index:2;animation:rewardPop .55s ease}
.reward-card.dimmed{opacity:.22;transform:scale(.94);transition:opacity .4s,transform .4s}
@keyframes rewardPop{0%{transform:scale(1)}45%{transform:scale(1.09) rotate(-2deg)}100%{transform:scale(1)}}
.reward-spark{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.reward-spark i{position:absolute;font-style:normal;color:#ffe47a;font-size:22px;animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{0%{opacity:0;transform:translate(0,15px) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-85px) scale(1.5) rotate(160deg)}}
.reward-parent{margin-top:14px}
.reward-parent input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);margin:5px 0 10px}
.reward-parent .pin-input{letter-spacing:.35em;text-align:center;font-size:1.3rem}
.reward-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.reward-actions button{flex:1;text-align:center}
@media(max-width:380px){.reward-card{height:190px}.reward-grid{gap:9px}}

</style>
</head>

      '<span class="reward-face reward-back"><span class="gift">🎁</span><span class="reward-label">유주의 오늘의 보상</span><span class="reward-value"></span></span></span>';
    (function(c,index){

  return [intro,grid,result];
}
function ks(d){return d[1]+' '+d[2]}
function rng(){var g=+document.getElementById('g').value,o=document.getElementById('o').checked,r=[];D.forEach(function(d,i){if(o?d[3]==g:d[3]<=g)r.push(i)});return r}
// 선택 급수의 신출한자를 80%, 하위 급수 복습 한자를 20%로 구성한다.
// 해당 급수에 문항이 부족하면 다른 쪽에서 채우고, 전체 한자 수도 부족하면 가능한 만큼만 출제한다.
function gradeWeightedPool(n){
  var g=+document.getElementById('g').value;
  if(document.getElementById('o').checked)return sh(rng()).slice(0,n);
  var fresh=[],review=[];
  D.forEach(function(d,i){if(d[3]===g)fresh.push(i);else if(d[3]<g)review.push(i)});
  fresh=sh(fresh);review=sh(review);
  var count=Math.min(n,fresh.length+review.length);
  var freshCount=Math.min(fresh.length,Math.round(count*.8));
  var reviewCount=Math.min(review.length,count-freshCount);
  // 복습 한자가 부족한 경우 신출한자를 추가한다.
  freshCount=Math.min(fresh.length,count-reviewCount);
  // 신출한자가 부족한 경우 복습 한자를 추가한다.
  reviewCount=Math.min(review.length,count-freshCount);
  return sh(fresh.slice(0,freshCount).concat(review.slice(0,reviewCount)));
}
function pick(m,i){
  var d=D[i],ans,o=[],pool=sh(POOL),f;
  if(m=='0'){ans=ks(d);f=function(x){return ks(x)}}
  else if(m=='1'){ans=d[2];f=function(x){return x[2]}}
  else{ans=d[0];f=function(x){return x[0]}}
  o=[ans];
  for(var j=0;j<pool.length&&o.length<4;j++){var x=D[pool[j]];if(x===d||ks(x)===ks(d))continue;var v=f(x);if(o.indexOf(v)<0)o.push(v)}
  return {t:GR[d[3]]+' · '+(m=='2'?'훈·음 → 한자':(m=='0'?'한자 → 훈·음':'한자 → 음')),q:m=='2'?ks(d):d[0],big:m!='2',g:m=='2',a:ans,o:o,e:d[0]+' = '+ks(d)+' ('+GR[d[3]]+')',k:m+'|'+d[0],x:d[4]?'예) '+d[4]:''};
}
function samp(i){var q=Q0[i];return {t:q[0],q:q[1],a:q[2],o:q[3],e:q[4],k:'S|'+i}}
function build(k){var p=k.split('|');if(p[0].charAt(0)=='R')return rq(p[0],p[1]);return p[0]=='S'?samp(+p[1]):(H[p[1]]===undefined?null:pick(p[0],H[p[1]]))}
function home(){
  var w=saved();

  '<section class="home-section section-study"><h2>시험 공부</h2><button class="p mix m" data-m="x">혼합 (세 유형 섞어서)</button><div class="sp"></div>'+MODES.map(function(m){return '<button class="p m" data-m="'+m[1]+'">'+m[0]+'</button><div class="sp"></div>'}).join('')+'</section>'+
  '<section class="home-section section-radical"><h2>부수 공부</h2><button class="p mix m" data-m="r0">부수 → 훈·음</button><div class="sp"></div><button class="p m" data-m="r1">훈·음 → 부수</button><div class="sp"></div><button class="p m" data-m="r2">변형 부수 → 본래 부수</button></section>'+
  '<section class="home-section section-extra"><button class="m" data-m="W"'+(w.length?'':' disabled style="opacity:.5"')+'>오답만 다시 풀기 ('+w.length+')</button><div class="sp"></div><button id="historyBtn">📚 학습 기록 보기 ('+getHistory().length+')</button><div class="sp"></div><button id="parentModeBtn">🔒 부모 모드</button></section></div>';

  document.getElementById('parentModeBtn').onclick=parentMode;

  app.querySelectorAll('.m').forEach(function(b){b.onclick=function(){
    var m=b.dataset.m,n=+document.getElementById('n').value,ks_;POOL=(m=='W')?D.map(function(_,i){return i}):rng();if(!POOL.length&&m!='S')return;if(m=='r0'||m=='r1'){start(sh(R.map(function(r){return 'R'+m.charAt(1)+'|'+r[0]})).slice(0,n),m=='r0'?'부수 → 훈·음':'훈·음 → 부수');return}if(m=='r2'){start(sh(V.map(function(v,i){return 'R2|'+i})).slice(0,n),'변형 부수 → 본래 부수');return}
    if(m=='W')ks_=sh(w);
    else if(m=='S')ks_=sh(Q0.map(function(_,i){return 'S|'+i}));
    else ks_=gradeWeightedPool(n).map(function(i,x){return (m=='x'?String(x%3):m)+'|'+D[i][0]});
    var labels={'W':'오답만 다시 풀기','S':'기초 한자 문제','x':'혼합 (세 유형 섞어서)','0':'한자 → 훈·음','1':'한자 → 음','2':'훈·음 → 한자'};
    start(ks_,labels[m]||'한자 퀴즈');
  }});
}
function start(keys,modeLabel){var grade='';if(modeLabel==='오답만 다시 풀기'){var grades=[];keys.forEach(function(k){var p=k.split('|');if(p[0].charAt(0)==='R'){if(grades.indexOf('부수')<0)grades.push('부수')}else if(p[0]==='S'){if(grades.indexOf('기초')<0)grades.push('기초')}else if(H[p[1]]!==undefined){var g=GR[D[H[p[1]]][3]];if(grades.indexOf(g)<0)grades.push(g)}});grade=grades.length===1?grades[0]:(grades.length?'혼합':'이전 기록')}else if(modeLabel&&modeLabel.indexOf('부수')===0){grade='부수'}else if(modeLabel==='기초 한자 문제'){grade='기초'}else{var sel=document.getElementById('g');grade=sel?GR[+sel.value]:'미상'}S={q:keys.map(build).filter(Boolean),i:0,answers:[],modeLabel:modeLabel||'한자 퀴즈',gradeLabel:grade};show()}
function show(){
  var q=S.q[S.i],o=sh(q.o),a=S.answers[S.i];
  app.innerHTML='<div class="bar"><i style="width:'+((S.i+1)/S.q.length*100)+'%"></i></div>'+
  '<p class="mut">'+(S.i+1)+' / '+S.q.length+'</p>'+
  '<div class="sp"></div><div style="display:flex;gap:8px;margin-bottom:8px">'+
  '<button id="prev"'+(S.i===0?' disabled style="opacity:.45"':'')+'>앞으로</button>'+
  '</div>'+//'<button id="home">처음으로</button></div>'+
  '<div class="card"><div class="type">'+esc(q.t)+'</div>'+
  '<div class="q">'+esc(q.q)+'</div><div class="opts'+(q.g?' g':'')+'">'+o.map(function(t){return '<button data-v="'+esc(t)+'"'+(a?' disabled':'')+'>'+esc(t)+'</button>'}).join('')+'</div><div id="e"></div></div>';
  document.getElementById('prev').onclick=function(){if(S.i>0){S.i--;show()}};
  //document.getElementById('home').onclick=home;
  var bs=app.querySelectorAll('.opts button');
  if(a){
    bs.forEach(function(x){if(x.dataset.v===q.a)x.className='ok';else if(x.dataset.v===a.selected&&!a.good)x.className='no'});
    document.getElementById('e').innerHTML='<div class="exp"><b style="color:'+(a.good?'#16a34a':'#dc2626')+'">'+(a.good?'오 맞혔어^o^':'아깝게 틀렸어 ㅠㅠ')+'</b><div class="answer-explanation">'+esc(q.e)+(q.x?'<br>'+esc(q.x):'')+'</div></div><div class="sp"></div><button class="p" id="next">'+(S.i+1<S.q.length?'다음으로':'과연 결과는?')+'</button>';
    document.getElementById('next').onclick=function(){S.i++;S.i<S.q.length?show():done()};
    return;
  }
  bs.forEach(function(b){b.onclick=function(){
    var good=b.dataset.v===q.a;
    S.answers[S.i]={selected:b.dataset.v,good:good};
    bs.forEach(function(x){x.disabled=true;if(x.dataset.v===q.a)x.className='ok'});
    if(!good)b.className='no';
    document.getElementById('e').innerHTML='<div class="exp"><b style="color:'+(good?'#16a34a':'#dc2626')+'">'+(good?'오 맞혔어^o^':'아깝게 틀렸어 ㅠㅠ')+'</b><div class="answer-explanation">'+esc(q.e)+(q.x?'<br>'+esc(q.x):'')+'</div></div><div class="sp"></div><button class="p" id="next">'+(S.i+1<S.q.length?'다음으로':'과연 결과는?')+'</button>';
    document.getElementById('next').onclick=function(){S.i++;S.i<S.q.length?show():done()};
  }});
}
function showHistory(){
  var h=getHistory();
  app.innerHTML='<h1>학습 기록</h1><p class="mut">퀴즈를 마칠 때마다 기록이 자동으로 저장돼요. 최근 100회까지 보관합니다.</p>'+
    (h.length?'<div class="card"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.92rem"><thead><tr><th style="text-align:left;padding:9px 5px">일시</th><th style="padding:9px 5px">급수</th><th style="text-align:left;padding:9px 5px">유형</th><th style="padding:9px 5px">점수</th><th style="padding:9px 5px">틀린 개수</th></tr></thead><tbody>'+h.map(function(r){return '<tr><td style="padding:10px 5px;border-top:1px solid var(--line, #444);white-space:nowrap">'+esc(r.date)+'</td><td style="text-align:center;padding:10px 5px;border-top:1px solid var(--line, #444);white-space:nowrap">'+esc(r.grade||'이전 기록')+'</td><td style="padding:10px 5px;border-top:1px solid var(--line, #444)">'+esc(r.type)+'</td><td style="text-align:center;padding:10px 5px;border-top:1px solid var(--line, #444);font-weight:800;white-space:nowrap">'+r.score+'점<br><span class="mut">'+r.correct+'/'+r.total+'</span></td><td style="text-align:center;padding:10px 5px;border-top:1px solid var(--line, #444);white-space:nowrap">'+r.wrong+'개</td></tr>'}).join('')+'</tbody></table></div></div>':'<div class="card"><p>아직 학습 기록이 없어요. 퀴즈를 한 번 완료하면 여기에 저장돼요!</p></div>')+

function done(){
  var ok=0,wrong=[];S.q.forEach(function(q,i){var a=S.answers[i];if(a&&a.good)ok++;else wrong.push(q)});
  var tried=S.q.map(function(q){return q.k}),wk=wrong.map(function(q){return q.k});
  save(saved().filter(function(x){return tried.indexOf(x)<0}).concat(wk));
  var pct=Math.round(ok/S.q.length*100);
  // 오답만 다시 풀기는 학습 기록에 추가하지 않음
  if(S.modeLabel!=='오답만 다시 풀기'){
    var hist=getHistory();
    hist.unshift({date:dateLabel(new Date()),grade:S.gradeLabel||'미상',type:S.modeLabel||'한자 퀴즈',score:pct,correct:ok,wrong:wrong.length,total:S.q.length});
    putHistory(hist.slice(0,100));
  }
  app.innerHTML='<h1>결과</h1><div class="card"><div class="big">'+ok+' / '+S.q.length+' ('+pct+'점)</div>'+
  (wrong.length?'<p class="mut">틀렸던 문제니까 다시 한번 살펴보자!</p><ul>'+wrong.map(function(q){return '<li>'+esc(q.e)+'</li>'}).join('')+'</ul>':'<p>모두 맞혔어! 역시 한자 박사 손유주야!</p>')+
  '</div><div id="rewardArea"></div><button class="p" id="h">처음으로</button>';
  // 오답만 다시 풀기에서는 100점이어도 보상 카드를 표시하지 않음
  if(pct===100 && S.modeLabel!=='오답만 다시 풀기'){
    var area=document.getElementById('rewardArea');
    showRewards().forEach(function(part){area.appendChild(part)});
  }
  document.getElementById('h').onclick=home;
}
// Keep pinch zoom available when WebKit ignores touch-action for double taps.
var tapStart=null,lastTap=null;
function nearbyTouches(a,b,limit){
  var dx=a.clientX-b.clientX,dy=a.clientY-b.clientY;
  return dx*dx+dy*dy<=limit*limit;
}
document.addEventListener('touchstart',function(event){
  tapStart=event.touches.length===1?event.touches[0]:null;
  if(!tapStart)lastTap=null;
},{passive:true});
document.addEventListener('touchcancel',function(){tapStart=null;lastTap=null},{passive:true});
document.addEventListener('touchend',function(event){
  var touch=event.changedTouches[0],start=tapStart;
  tapStart=null;
  if(!start||event.touches.length||event.changedTouches.length!==1||
      start.identifier!==touch.identifier||!nearbyTouches(start,touch,12)){
    lastTap=null;
    return;
  }
  if(event.cancelable&&lastTap&&event.timeStamp-lastTap.time<400&&nearbyTouches(lastTap.touch,touch,32)){
    event.preventDefault();
  }
  lastTap={touch:touch,time:event.timeStamp};
},{passive:false});
try{home();}catch(e){app.innerHTML='<div style="padding:20px;font-family:sans-serif"><h2>한자 박사 孫愈宙</h2><p>화면을 여는 중 오류가 발생했습니다.</p><p style="font-size:12px;color:#777">'+String(e.message||e)+'</p></div>'; }
